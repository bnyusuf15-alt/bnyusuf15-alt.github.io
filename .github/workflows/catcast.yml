name: Update Catcast Streams

on:
  schedule:
    - cron: '0 * * * *'  # Run every 2 hours
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: catcast-update
  cancel-in-progress: false  # Wait for previous run to complete

permissions:
  contents: write
  
jobs:
  update-streams:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: config
      run: |
          git config --global user.email "<>"
          git config --global user.name "catcast bot"
          
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run update script
      run: python catcast.py
    
    - name: Commit and push changes
      run: |
        git add catcast/
        git add -u catcast/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update Catcast streams [$(date +'%Y-%m-%d %H:%M:%S')]" && git push)
